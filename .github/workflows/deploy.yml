name: Deploy to GoDaddy cPanel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Remove these 2 steps if you have NO build process
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build
        run: |
          npm ci
          npm run build
      - name: Show build output
        run: |
          pwd
          ls -la
          ls -la dist || true
          find . -maxdepth 4 -type d -name "dist" -o -name "build" -o -name "out"
