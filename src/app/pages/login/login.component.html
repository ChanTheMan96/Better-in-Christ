<section class="login-page page-content">
  <div class="halo"></div>

  <article class="login-card panel">
    <p class="kicker">Better in Christ</p>
    <h1>Welcome back, brother</h1>
    <p class="subhead">
      Continue your walk with prayer, scripture, and daily guidance built for steady growth.
    </p>

    <div class="cta-row">
      <button class="primary" type="button" (click)="login()">Login or Create Account</button>
      <a class="secondary" routerLink="/faith-scroll">Explore First</a>
    </div>

    <div class="verse-band">
      <span>Philippians 1:6</span>
      <p>
        He who began a good work in you will carry it on to completion until the day of Christ Jesus.
      </p>
    </div>
  </article>
</section>
