<div class="container">
  <div class="page-content">
    <section class="emotion-intro page-intro">
      <h1>Parent Blessings</h1>
      <p>
        Choose a category and pray Scripture-shaped blessings over your child with consistency and faith.
      </p>
      <span class="emotion-count">{{ categories.length }} categories</span>
    </section>

    <div nz-row [nzGutter]="[16, 16]" class="emotion-grid">
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" *ngFor="let category of categories">
        <nz-card (click)="openCategory(category)" [nzHoverable]="true" class="emotion-card">
          <div class="emotion-icon-wrapper">
            <span nz-icon [nzType]="category.icon" nzTheme="outline" class="emotion-icon"></span>
          </div>
          <h3 class="emotion-title">{{ category.emotion }}</h3>
        </nz-card>
      </div>
    </div>
  </div>
</div>
