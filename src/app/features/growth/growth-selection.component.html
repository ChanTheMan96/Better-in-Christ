<div class="container">
  <div class="page-content">
    <section class="emotion-intro page-intro">
      <h1>Growth</h1>
      <p>
        Select a trait to strengthen mature Christian character through practical formation and
        relevant Scripture.
      </p>
      <span class="emotion-count">{{ traits.length }} traits</span>
    </section>

    <div nz-row [nzGutter]="[16, 16]" class="emotion-grid">
      <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" *ngFor="let trait of traits">
        <nz-card (click)="openTrait(trait)" [nzHoverable]="true" class="emotion-card">
          <div class="emotion-icon-wrapper">
            <span nz-icon [nzType]="trait.icon" nzTheme="outline" class="emotion-icon"></span>
          </div>
          <h3 class="emotion-title">{{ trait.emotion }}</h3>
        </nz-card>
      </div>
    </div>
  </div>
</div>
