<nav class="app-header text-white">
  <div class="container">
    <div class="row align-items-center justify-content-between py-2">
      <div class="col-auto d-flex align-items-center gap-3">
        <button
          nz-button
          nzType="default"
          class="menu-toggle"
          (click)="toggleMobileMenu()"
          aria-label="Open navigation menu"
          >
          <span class="hamburger-icon" aria-hidden="true"></span>
        </button>
        <a href="#" (click)="goHome($event)" class="brand-link h5 mb-0 text-white" aria-label="Better in Christ home">
          <img src="assets/logo.png" alt="" class="brand-logo" aria-hidden="true">
          <span>Better in Christ</span>
        </a>
      </div>
      @if (!isStandaloneApp) {
      <div class="col-auto">
        <span
          class="install-icon-action"
          (click)="addToHomeScreen()"
          (keydown.enter)="addToHomeScreen()"
          (keydown.space)="addToHomeScreen()"
          role="button"
          tabindex="0"
          aria-label="Add to Home Screen"
          title="Add to Home Screen"
          >
          <span nz-icon nzType="book" nzTheme="outline"></span>
        </span>
      </div>
      }
    </div>
  </div>
</nav>

@if (mobileMenuOpen) {
  <div
    class="mobile-menu-backdrop"
    (click)="closeMobileMenu()"
  ></div>
}

<aside class="mobile-menu" [class.open]="mobileMenuOpen">
  <div class="mobile-menu-header">
    <span class="mobile-brand">
      <img src="assets/logo.png" alt="" class="brand-logo" aria-hidden="true">
      <span>Better in Christ</span>
    </span>
    <button nz-button nzType="text" (click)="closeMobileMenu()" aria-label="Close navigation menu">
      <span nz-icon nzType="close" nzTheme="outline"></span>
    </button>
  </div>

  <div class="mobile-menu-links">
    @if (isSignedIn) {
      <div class="mobile-auth-row">
        <button nz-button nzType="default" class="mobile-user-chip" (click)="goToDashboard()">
          <span>{{ userDisplayName || 'Brother' }}</span>
          <span nz-icon nzType="audit" nzTheme="outline" aria-hidden="true"></span>
        </button>
        <button nz-button nzType="default" class="mobile-user-chip icon-only" (click)="signOut()" aria-label="Sign Out">
          <span nz-icon nzType="logout" nzTheme="outline" aria-hidden="true"></span>
        </button>
      </div>
    } @else {
      <div class="mobile-auth-row">
        <button nz-button nzType="default" class="mobile-user-chip icon-only" (click)="goToLogin()" aria-label="Login">
          <span nz-icon nzType="login" nzTheme="outline" aria-hidden="true"></span>
        </button>
      </div>
    }

    <a routerLink="/faith-scroll" (click)="closeMobileMenu()" class="mobile-link">Faith Scroll</a>
    <a routerLink="/donate" (click)="closeMobileMenu()" class="mobile-link">Donate</a>
    <a routerLink="/contact" (click)="closeMobileMenu()" class="mobile-link">Report a Bug</a>
    <button nz-button nzType="default" class="mobile-link version-link" (click)="openVersionPicker()">
      Change Bible Version
    </button>
  </div>

</aside>
