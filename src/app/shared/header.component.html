<nav class="app-header text-white" [class.faith-scroll-header]="isFaithScrollRoute">
  <div class="container">
    <div class="row align-items-center justify-content-between py-2">
      <div class="col-auto d-flex align-items-center gap-3">
        <button
          nz-button
          nzType="default"
          class="menu-toggle"
          (click)="toggleMobileMenu()"
          aria-label="Open navigation menu"
        >
          <span class="hamburger-icon" aria-hidden="true"></span>
        </button>
        <a href="#" (click)="goHome($event)" class="brand-link h5 mb-0 text-white" aria-label="Better in Christ home">
          <img src="assets/logo.png" alt="" class="brand-logo" aria-hidden="true">
          <span>Better in Christ</span>
        </a>
      </div>
      <div class="col-auto">
        <label class="header-scroll-picker" *ngIf="isFaithScrollRoute; else installAction">
          <span>Scroll</span>
          <select
            [ngModel]="selectedScrollCategory"
            (ngModelChange)="onScrollCategoryChange($event)"
            aria-label="Choose scroll category"
          >
            <optgroup *ngFor="let group of scrollCategoryGroups" [label]="group.label">
              <option *ngFor="let category of group.categories" [value]="category.name">{{ category.name }}</option>
            </optgroup>
          </select>
        </label>

        <ng-template #installAction>
          <span
            class="install-icon-action"
            (click)="addToHomeScreen()"
            (keydown.enter)="addToHomeScreen()"
            (keydown.space)="addToHomeScreen()"
            role="button"
            tabindex="0"
            aria-label="Add to Home Screen"
            title="Add to Home Screen"
          >
            <span nz-icon nzType="book" nzTheme="outline"></span>
          </span>
        </ng-template>
      </div>
    </div>
  </div>
</nav>

<div
  class="mobile-menu-backdrop"
  *ngIf="mobileMenuOpen"
  (click)="closeMobileMenu()"
></div>

<aside class="mobile-menu" [class.open]="mobileMenuOpen">
  <div class="mobile-menu-header">
    <span class="mobile-brand">
      <img src="assets/logo.png" alt="" class="brand-logo" aria-hidden="true">
      <span>Better in Christ</span>
    </span>
    <button nz-button nzType="text" (click)="closeMobileMenu()" aria-label="Close navigation menu">
      <span nz-icon nzType="close" nzTheme="outline"></span>
    </button>
  </div>

  <div class="mobile-menu-links">
    <a routerLink="/emotions" (click)="closeMobileMenu()" class="mobile-link">Emotions</a>
    <a routerLink="/faith-scroll" (click)="closeMobileMenu()" class="mobile-link">Faith Scroll</a>
    <a routerLink="/growth" (click)="closeMobileMenu()" class="mobile-link">Growth</a>
    <a routerLink="/parent-blessings" (click)="closeMobileMenu()" class="mobile-link">Parent Blessings</a>
    <a routerLink="/relationship-guide" (click)="closeMobileMenu()" class="mobile-link">Relationship Guide</a>
    <a routerLink="/who-i-am" (click)="closeMobileMenu()" class="mobile-link">Who I Am</a>
    <a routerLink="/prayer" (click)="closeMobileMenu()" class="mobile-link">Prayer</a>
    <a routerLink="/surrender" (click)="closeMobileMenu()" class="mobile-link">Surrender</a>
    <a routerLink="/donate" (click)="closeMobileMenu()" class="mobile-link">Donate</a>
    <a routerLink="/contact" (click)="closeMobileMenu()" class="mobile-link">Report a Bug</a>
    <button nz-button nzType="default" class="mobile-link version-link" (click)="openVersionPicker()">
      Change Bible Version
    </button>
  </div>

</aside>
